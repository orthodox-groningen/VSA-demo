# Build and deploy VSA-demo to GitHub Pages (site root on gh-pages).
# URL: https://orthodox-groningen.github.io/VSA-demo/
# Pages setting: Deploy from a branch → gh-pages → /.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-vsa-demo
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vsa-tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install "vsa-tool[rendering] @ git+https://github.com/orthodox-groningen/VSA-tooling.git@main"

      - name: Install rendering fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Validate VSA content
        run: vsa validate --summary content-source

      - name: Generate Markdown + SVG
        run: |
          rm -rf generated/content static/vsa
          vsa build-markdown \
            content-source \
            generated/content \
            static/vsa \
            --output-mode shortcode

      - name: Update navigation placeholders
        run: python scripts/update-nav-placeholders.py generated/content

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"

      - name: Build Hugo site
        run: |
          hugo \
            --source . \
            --contentDir generated/content \
            --destination generated/site \
            --minify \
            --baseURL "https://orthodox-groningen.github.io/VSA-demo/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: generated/site
          publish_branch: gh-pages
          force_orphan: true
