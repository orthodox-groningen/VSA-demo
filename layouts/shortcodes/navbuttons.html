<div class="nav-buttons">
  {{- range .Params }}
    {{- $parts := split . "|" -}}
    {{- $text := trim (index $parts 0) " \t\"\\" -}}
    {{- $url  := trim (index $parts 1) " \t\"\\" -}}
    <a class="btn" href="{{ partial "internal-link-url.html" $url }}">
      {{ $text | safeHTML }}
    </a>
  {{- end }}
</div>

<style>
.nav-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.75rem;
  margin: 1rem 0;
}

/* Knoppen even breed, hoogte afhankelijk van inhoud */
.nav-buttons .btn {
  display: flex;
  flex-direction: column;      /* zodat meerdere regels netjes onder elkaar staan */
  justify-content: center;     /* verticaal centreren */
  align-items: center;         /* horizontaal centreren */
  text-align: center;
  padding: 0.75rem 0.5rem;     /* bepaalt minimale hoogte */
  background: #eee;
  border-radius: 6px;
  text-decoration: none;
  border: 1px solid #ccc;
  color: #000;
  transition: background 0.2s ease;
}

/* Tekst mag afbreken */
.nav-buttons .btn span {
  display: block;
  line-height: 1.25;
  white-space: normal;
}

/* Hover-effect */
.nav-buttons .btn:hover {
  background: #ddd;
}

</style>
